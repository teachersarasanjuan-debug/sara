name: Teacher Sara Social Publisher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teacher-sara-social-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run social publisher
        env:
          META_GRAPH_VERSION: v26.0
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_DIRECT_POST_ENABLED: ${{ vars.TIKTOK_DIRECT_POST_ENABLED }}
        run: |
          python3 scripts/social_publish.py

      - name: Commit published queue state
        run: |
          if git diff --quiet -- social/queue.json; then
            echo "No queue changes."
            exit 0
          fi
          git config user.name "Teacher Sara Social Bot"
          git config user.email "actions@users.noreply.github.com"
          git add social/queue.json
          git commit -m "Update social publishing queue"
          git push
