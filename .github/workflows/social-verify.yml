name: Verify Teacher Sara Social Connections # Meta credential check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/social-verify.yml'
      - 'scripts/social_verify.py'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify connections without publishing
        env:
          META_GRAPH_VERSION: v26.0
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python3 scripts/social_verify.py

      - name: Record successful verification
        if: success()
        run: |
          mkdir -p social
          printf '{"verified_at":"%s","facebook":"ok","instagram":"ok","tiktok":"ok","published_anything":false}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > social/connection-status.json
          git config user.name "Teacher Sara Social Verifier"
          git config user.email "actions@users.noreply.github.com"
          git add social/connection-status.json
          git diff --cached --quiet && exit 0
          git commit -m "Record social connection verification"
          git push
